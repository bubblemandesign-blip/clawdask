<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawdAsk — TikTok Intro Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #020202;
            color: #ededed;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 1080px;
            height: 1920px;
            position: relative;
        }

        /* ═══ JARVIS HUD GRID ═══ */
        .hud-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0;
            animation: gridFadeIn 1s 0.5s forwards;
        }
        @keyframes gridFadeIn { to { opacity: 1; } }

        /* ═══ SCANNING LINES ═══ */
        .scan-line {
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f97316, transparent);
            opacity: 0;
            animation: scanDown 4s 1s infinite;
        }
        @keyframes scanDown {
            0% { top: -3px; opacity: 0; }
            5% { opacity: 0.6; }
            95% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        /* ═══ CORNER BRACKETS (HUD) ═══ */
        .corner { position: absolute; width: 60px; height: 60px; opacity: 0; }
        .corner::before, .corner::after { content: ''; position: absolute; background: rgba(249,115,22,0.5); }
        .corner-tl { top: 40px; left: 40px; animation: cornerIn 0.4s 1.2s forwards; }
        .corner-tl::before { width: 2px; height: 60px; top: 0; left: 0; }
        .corner-tl::after { width: 60px; height: 2px; top: 0; left: 0; }
        .corner-tr { top: 40px; right: 40px; animation: cornerIn 0.4s 1.3s forwards; }
        .corner-tr::before { width: 2px; height: 60px; top: 0; right: 0; }
        .corner-tr::after { width: 60px; height: 2px; top: 0; right: 0; }
        .corner-bl { bottom: 40px; left: 40px; animation: cornerIn 0.4s 1.4s forwards; }
        .corner-bl::before { width: 2px; height: 60px; bottom: 0; left: 0; }
        .corner-bl::after { width: 60px; height: 2px; bottom: 0; left: 0; }
        .corner-br { bottom: 40px; right: 40px; animation: cornerIn 0.4s 1.5s forwards; }
        .corner-br::before { width: 2px; height: 60px; bottom: 0; right: 0; }
        .corner-br::after { width: 60px; height: 2px; bottom: 0; right: 0; }
        @keyframes cornerIn { to { opacity: 1; } }

        /* ═══ CENTER CONTAINER ═══ */
        .center-stage {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        /* ═══ CLAW LOGO ═══ */
        .claw-container {
            width: 320px; height: 320px;
            margin: 0 auto 60px;
            position: relative;
            opacity: 0;
            animation: clawAppear 1.2s 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes clawAppear {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); filter: blur(20px); }
            60% { opacity: 1; transform: scale(1.1) rotate(3deg); filter: blur(0); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
        }

        .claw-svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 40px rgba(249,115,22,0.4)) drop-shadow(0 0 80px rgba(249,115,22,0.15));
            animation: clawFloat 4s 2s ease-in-out infinite;
        }
        @keyframes clawFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Rotating ring around the claw */
        .claw-ring {
            position: absolute;
            top: -30px; left: -30px;
            width: 380px; height: 380px;
            border: 1px solid rgba(249,115,22,0.15);
            border-top: 2px solid #f97316;
            border-radius: 50%;
            animation: ringRotate 8s linear infinite;
            opacity: 0;
            animation: ringIn 0.6s 1.8s forwards, ringRotate 8s 1.8s linear infinite;
        }
        @keyframes ringIn { to { opacity: 1; } }
        @keyframes ringRotate { to { transform: rotate(360deg); } }

        .claw-ring-2 {
            position: absolute;
            top: -15px; left: -15px;
            width: 350px; height: 350px;
            border: 1px dashed rgba(249,115,22,0.08);
            border-radius: 50%;
            animation: ringRotateReverse 12s 2s linear infinite;
            opacity: 0;
            animation: ringIn 0.6s 2s forwards, ringRotateReverse 12s 2s linear infinite;
        }
        @keyframes ringRotateReverse { to { transform: rotate(-360deg); } }

        /* ═══ BRAND NAME ═══ */
        .brand-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(135deg, #f97316, #fb923c, #f97316);
            background-clip: text;
            -webkit-background-clip: text;
            opacity: 0;
            animation: nameReveal 0.8s 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes nameReveal {
            0% { opacity: 0; letter-spacing: 30px; filter: blur(10px); }
            100% { opacity: 1; letter-spacing: 8px; filter: blur(0); }
        }

        /* ═══ TAGLINE ═══ */
        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            color: rgba(249,115,22,0.6);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 20px;
            opacity: 0;
            animation: tagIn 0.6s 2.6s forwards;
        }
        @keyframes tagIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ═══ TYPING COMMAND LINE ═══ */
        .command-line {
            position: absolute;
            bottom: 200px;
            left: 80px; right: 80px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: rgba(249,115,22,0.7);
            text-align: left;
            opacity: 0;
            animation: cmdIn 0.4s 3.2s forwards;
        }
        @keyframes cmdIn { to { opacity: 1; } }

        .cmd-prompt { color: #f97316; }
        .cmd-text {
            display: inline;
            border-right: 2px solid #f97316;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { border-color: transparent; } }

        /* ═══ STATUS INDICATORS ═══ */
        .status-bar {
            position: absolute;
            top: 80px;
            left: 80px; right: 80px;
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: rgba(249,115,22,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: statusIn 0.4s 1.6s forwards;
        }
        @keyframes statusIn { to { opacity: 1; } }

        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #f97316;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(249,115,22,0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(249,115,22,0); }
        }

        /* ═══ GLITCH EFFECT ═══ */
        .glitch-overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            animation: glitch 0.15s 0.6s steps(2) 3;
            pointer-events: none;
            z-index: 100;
        }
        @keyframes glitch {
            0% { background: rgba(249,115,22,0.05); transform: translateX(-3px); }
            50% { background: rgba(249,115,22,0.08); transform: translateX(3px); }
            100% { background: transparent; transform: translateX(0); }
        }

        /* ═══ VIGNETTE ═══ */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* ═══ PARTICLE DOTS ═══ */
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: #f97316;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 6s infinite;
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(0); }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-400px); }
        }
    </style>
</head>
<body>
    <!-- HUD Grid -->
    <div class="hud-grid"></div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Corner Brackets -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span><span class="status-dot"></span>SYSTEM ONLINE</span>
        <span>v1.0.0</span>
    </div>

    <!-- Center Stage -->
    <div class="center-stage">
        <!-- Claw Logo with HUD rings -->
        <div class="claw-container">
            <div class="claw-ring"></div>
            <div class="claw-ring-2"></div>
            <!-- Pixel Crab Claw SVG (exact branding) -->
            <svg class="claw-svg" viewBox="0 0 64 64" fill="none">
                <!-- Left pincer -->
                <rect x="8" y="8" width="8" height="8" fill="#c2410c" rx="1"/>
                <rect x="8" y="16" width="8" height="8" fill="#f97316" rx="1"/>
                <rect x="16" y="16" width="8" height="8" fill="#fb923c" rx="1"/>
                <rect x="8" y="24" width="8" height="8" fill="#c2410c" rx="1"/>
                <rect x="16" y="24" width="8" height="8" fill="#f97316" rx="1"/>
                <!-- Right pincer -->
                <rect x="48" y="8" width="8" height="8" fill="#c2410c" rx="1"/>
                <rect x="48" y="16" width="8" height="8" fill="#f97316" rx="1"/>
                <rect x="40" y="16" width="8" height="8" fill="#fb923c" rx="1"/>
                <rect x="48" y="24" width="8" height="8" fill="#c2410c" rx="1"/>
                <rect x="40" y="24" width="8" height="8" fill="#f97316" rx="1"/>
                <!-- Body -->
                <rect x="16" y="32" width="32" height="8" fill="#f97316" rx="1"/>
                <rect x="20" y="40" width="24" height="8" fill="#c2410c" rx="1"/>
                <rect x="24" y="48" width="16" height="8" fill="#7c2d12" rx="1"/>
            </svg>
        </div>

        <div class="brand-name">ClawdAsk</div>
        <div class="tagline">Your Digital Employee</div>
    </div>

    <!-- Command Line -->
    <div class="command-line">
        <span class="cmd-prompt">> </span>
        <span class="cmd-text" id="typedText"></span>
    </div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Glitch -->
    <div class="glitch-overlay"></div>

    <script>
        // Typing animation
        const commands = [
            "Initializing autonomous agent...",
            "Mouse & keyboard control: ACTIVE",
            "Your Jarvis is ready."
        ];
        let cmdIndex = 0, charIndex = 0;
        const el = document.getElementById('typedText');

        function typeChar() {
            if (cmdIndex >= commands.length) return;
            const cmd = commands[cmdIndex];
            if (charIndex < cmd.length) {
                el.textContent += cmd[charIndex];
                charIndex++;
                setTimeout(typeChar, 40 + Math.random() * 30);
            } else {
                setTimeout(() => {
                    el.textContent = '';
                    charIndex = 0;
                    cmdIndex++;
                    typeChar();
                }, 1500);
            }
        }
        setTimeout(typeChar, 3500);

        // Particles
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.bottom = '-10px';
            p.style.animationDelay = Math.random() * 6 + 's';
            p.style.animationDuration = (4 + Math.random() * 4) + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
